<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gabor Szücs — Java Developer · ERP & E-Commerce Integration</title>
  <meta name="description" content="Gabor Szücs — Java Developer mit Fokus auf ERP- und E-Commerce-Integration sowie Legacy-Migration. Spring Boot, REST APIs, MSSQL. Ecknach, Bayern." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <style>
    @media print {
      @page { size: A4; margin: 14mm; }
      :root { --pad-section: 24px; }
      html, body { background: #fff !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      /* Disable sticky/fixed/animation */
      .nav { position: static !important; backdrop-filter: none !important; background: #fff !important; border-bottom: 1px solid var(--border) !important; }
      .theme-toggle, .nav-cta { display: none !important; }
      [data-reveal] { opacity: 1 !important; transform: none !important; }
      .status-pulse::after { display: none !important; }
      .hero-aurora, .hero-bg { display: none !important; }

      main > section { padding-top: 24px !important; padding-bottom: 24px !important; }
      .hero { padding-top: 12px !important; padding-bottom: 16px !important; }

      /* Page breaks per major section */
      #about, #work, #services, #stack, #experience, #contact { break-before: page; }
      .project-card, .service, .timeline-row, .stack-cell, .about-stat, .contact-card { break-inside: avoid; }
      h1, h2, h3, h4 { break-after: avoid; }

      /* Typography down-tune for print */
      .hero h1 { font-size: 40px !important; }
      .section-title { font-size: 28px !important; }
      .project-card.featured .project-visual { height: 200px !important; }
      .project-visual { height: 140px !important; }
      .container { max-width: 100% !important; padding: 0 !important; }

      /* Hide tweaks panel if it ever renders */
      [class*="tweaks"], [data-tweaks] { display: none !important; }

      /* Ensure project grid stays 2-up but compact */
      .projects-grid { gap: 12px !important; }
      .project-card { padding: 16px !important; }
      .footer { break-before: avoid; padding: 16px 0 !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    (async () => {
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      setTimeout(() => window.print(), 700);
    })();
  </script>
</body>
</html>
