<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100vmin;
    height: 100vmin;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.045);
    animation: ringPulse 5s ease-in-out infinite;
  }
  .ring:nth-child(1) { width: 58%; height: 58%; animation-delay: 0s; }
  .ring:nth-child(2) { width: 74%; height: 74%; animation-delay: 0.5s; }
  .ring:nth-child(3) { width: 90%; height: 90%; animation-delay: 1s; }

  @keyframes ringPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.008); }
  }

  .logo-wrap {
    position: relative;
    width: 40%;
    animation: logoEntry 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
  }

  @keyframes logoEntry {
    0% {
      opacity: 0;
      transform: scale(0.82) translateY(24px);
      filter: blur(16px);
    }
    55% { filter: blur(0px); }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0px);
    }
  }

  .logo-wrap img {
    width: 100%;
    display: block;
    filter: invert(1);
    animation: logoBreathe 7s ease-in-out 2.2s infinite;
  }

  @keyframes logoBreathe {
    0%, 100% { transform: scale(1); filter: invert(1) drop-shadow(0 0 0px rgba(255,255,255,0)); }
    50% { transform: scale(1.014); filter: invert(1) drop-shadow(0 0 32px rgba(255,255,255,0.2)); }
  }

  .shimmer {
    position: absolute;
    inset: -10%;
    background: linear-gradient(
      115deg,
      transparent 25%,
      rgba(255,255,255,0.22) 50%,
      transparent 75%
    );
    background-size: 300% 100%;
    mix-blend-mode: overlay;
    pointer-events: none;
    border-radius: 4px;
    animation: shimmerSweep 4s ease-in-out 2s infinite;
    opacity: 0;
  }

  @keyframes shimmerSweep {
    0% { background-position: 220% 0; opacity: 0; }
    8% { opacity: 1; }
    55% { background-position: -120% 0; opacity: 1; }
    75% { opacity: 0; }
    100% { background-position: -120% 0; opacity: 0; }
  }

  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    opacity: 0;
    animation: cornerFade 0.5s ease-out forwards;
  }
  .corner--tl { top: -10px; left: -10px; border-top: 1px solid rgba(255,255,255,0.55); border-left: 1px solid rgba(255,255,255,0.55); animation-delay: 1.6s; }
  .corner--tr { top: -10px; right: -10px; border-top: 1px solid rgba(255,255,255,0.55); border-right: 1px solid rgba(255,255,255,0.55); animation-delay: 1.75s; }
  .corner--bl { bottom: -10px; left: -10px; border-bottom: 1px solid rgba(255,255,255,0.55); border-left: 1px solid rgba(255,255,255,0.55); animation-delay: 1.9s; }
  .corner--br { bottom: -10px; right: -10px; border-bottom: 1px solid rgba(255,255,255,0.55); border-right: 1px solid rgba(255,255,255,0.55); animation-delay: 2.05s; }

  @keyframes cornerFade {
    to { opacity: 1; }
  }

  .scanline {
    position: absolute;
    left: -12%;
    right: -12%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.7) 50%, transparent 100%);
    top: 0;
    animation: scanDown 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both;
    opacity: 0;
  }

  @keyframes scanDown {
    0% { top: -5%; opacity: 0; }
    8% { opacity: 1; }
    88% { opacity: 0.8; }
    100% { top: 105%; opacity: 0; }
  }

  .label {
    position: absolute;
    bottom: 13%;
    left: 50%;
    transform: translateX(-50%);
    letter-spacing: 0.4em;
    font-size: 9px;
    color: rgba(255,255,255,0.22);
    text-transform: uppercase;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    white-space: nowrap;
    animation: labelFade 1.2s ease-out 2.4s both;
  }

  @keyframes labelFade {
    from { opacity: 0; letter-spacing: 0.7em; }
    to { opacity: 1; letter-spacing: 0.4em; }
  }

  .grain {
    position: fixed;
    inset: -60%;
    width: 220%;
    height: 220%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    animation: grainMove 0.12s steps(3) infinite;
  }

  @keyframes grainMove {
    0% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(-1.5%, -1%) rotate(0.1deg); }
    66% { transform: translate(1%, 0.5%) rotate(-0.1deg); }
    100% { transform: translate(-0.5%, 1%) rotate(0.05deg); }
  }
</style>
</head>
